<button class="fullscreen-btn" onclick="toggleFullscreen('page-budget')" title="Fullscreen">⛶</button>

<!-- Categorisation status bar (always visible) -->
<div id="cat-status-bar" style="margin-bottom:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px">
  <div id="cat-status-text" style="font-size:14px;color:var(--text2)">Loading…</div>
  <div id="cat-status-action"></div>
</div>

<!-- Review card (shown during active categorisation) -->
<div id="review-section" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <div class="pt">CATEGORISE</div>
    <div id="rev-progress" style="font-size:13px;color:var(--text3);font-family:var(--num)"></div>
  </div>
  <div class="mbox" id="rev-card"></div>
</div>

<div class="ph" style="display:flex;justify-content:space-between;align-items:flex-start">
  <div><div class="pt" id="bud-title">BUDGET</div><div class="ps" id="bud-sub">Current + 5 months ahead</div></div>
  <button class="btn btn-g" onclick="confirmResetCats()" style="font-size:14px;padding:8px 14px;border-color:#ef5350;color:#ef5350">⚠ Reset categories</button>
</div>

<div id="bud-month-pills" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
  <div style="font-size:15px;font-weight:600;color:var(--text)">Monthly Budget</div>
  <div style="display:flex;gap:8px;align-items:center">
    <div style="font-size:13px;color:var(--text2)">Est. total: <span id="bud-total-auto" style="font-family:var(--num);font-weight:600"></span></div>
    <button class="btn btn-g" onclick="openAddCatModal()" style="font-size:13px;padding:6px 12px">+ Category</button>
    <button class="btn btn-g" onclick="openMarkersModal()" style="font-size:13px;padding:6px 12px;border-color:#f9a825;color:#f9a825">✕ Markers</button>
  </div>
</div>

<div id="bud-cat-grid" class="cat-grid"></div>
<div class="btn-row"><button class="btn btn-p" onclick="saveCatBuds()">Save Budget</button></div>
